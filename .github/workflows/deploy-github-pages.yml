name: Deploy CinePulse HD to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  # Automatically refresh static snapshot in the background (while browser live engine syncs every 30s!)
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Refresh Live Cinema Database Snapshot (static-db.json)
        continue-on-error: true
        run: npm run generate-db

      - name: Build Production Static Bundle for GitHub Pages
        run: npm run build

      - name: Copy 404.html & .nojekyll to dist
        run: |
          cp public/.nojekyll dist/.nojekyll || true
          cp index.html dist/404.html || true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
